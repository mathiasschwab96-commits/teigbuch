# Teigbuch – hält das kostenlose Supabase-Projekt wach.
# Supabase pausiert Gratis-Projekte nach 7 Tagen ohne Aktivität. Dieser Zeitplan
# fragt die Datenbank alle 3 Tage kurz an. Zusätzlich verhindert er, dass GitHub
# den Zeitplan nach 60 Tagen ohne Änderung im Repository abschaltet.
#
# Benötigt zwei „Repository secrets“ (Settings → Secrets and variables → Actions):
#   SUPABASE_URL       z. B. https://abcdefghijkl.supabase.co
#   SUPABASE_ANON_KEY  der Publishable-/anon-Schlüssel (derselbe wie in config.js)

name: Supabase wach halten

on:
  schedule:
    - cron: '17 6 */3 * *'   # alle 3 Tage um 06:17 UTC
  workflow_dispatch:          # „Run workflow“-Knopf zum Testen

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase anfragen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Secrets SUPABASE_URL und SUPABASE_ANON_KEY fehlen (siehe ANLEITUNG.txt, Teil E)."
            exit 1
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" "$SUPABASE_URL/rest/v1/items?select=id&limit=1" -H "apikey: $SUPABASE_ANON_KEY")
          echo "Antwort von Supabase: HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Supabase antwortet nicht mit 200 – ist das Projekt pausiert oder die URL falsch?"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Repository aktiv halten
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( now - last )) -gt 4320000 ]; then   # älter als 50 Tage
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keepalive"
            git push
          else
            echo "Letzter Commit ist jünger als 50 Tage – nichts zu tun."
          fi
