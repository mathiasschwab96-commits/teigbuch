<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teigbuch – Kompatibilitätstest</title>
<style>
  :root { --bg: #F6F2EC; --text: #1F1A16; --ok: #2F7A4A; --bad: #B3261E; --muted: #7C6F65; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #131110; --text: #F4EDE6; --ok: #7CC490; --bad: #F2867E; --muted: #A69789; } }
  :root[data-theme="dark"] { --bg: #131110; --text: #F4EDE6; --ok: #7CC490; --bad: #F2867E; --muted: #A69789; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, sans-serif; max-width: 860px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .sum { font-size: 1.15rem; font-weight: 700; margin: 12px 0; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  h2 { font-size: 1rem; margin: 18px 0 6px; }
  li { margin: 2px 0; }
  small { color: var(--muted); }
</style>
</head>
<body>
<h1>Teigbuch – Kompatibilitätstest</h1>
<small>Prüft, dass alte Sicherungen mit der aktuellen App-Version weiter funktionieren. Nach JEDER Änderung am Datenformat ausführen – alles muss grün sein.</small>
<div class="sum" id="sum">läuft …</div>
<div id="out"></div>
<script type="module">
import * as C from '../calc.js';
import * as MG from '../migrate.js';

const out = document.getElementById('out');
let pass = 0, fail = 0, section;
const group = (title) => { section = document.createElement('ul'); const h = document.createElement('h2'); h.textContent = title; out.append(h, section); };
const check = (label, cond, detail = '') => {
  const li = document.createElement('li');
  li.innerHTML = `<span class="${cond ? 'ok' : 'bad'}">${cond ? '✔' : '✘'}</span> ${label}${detail ? ` <small>(${detail})</small>` : ''}`;
  section.append(li);
  cond ? pass++ : fail++;
};
const near = (a, b, tol = 0.05) => Math.abs(a - b) <= tol;
const load = async (f) => (await fetch(`./fixtures/${f}?t=${Date.now()}`)).json();
const roundtrip = (o) => JSON.parse(JSON.stringify(o));

// ---------- 1) Sicherung aus App 1.4 (Format 1, Einträge ohne Versionsfeld) ----------
{
  group('Sicherung aus App 1.4 (backup-format1-app1.4.json)');
  const f = await load('backup-format1-app1.4.json');
  const recs = f.recipes.map((r) => MG.importRecipe(r));
  recs.forEach(({ rec, newer }) => check(`„${rec.name}“ auf aktuelles Format gebracht`, rec.v === MG.SCHEMA && !newer, `v=${rec.v}`));
  const biga = recs[0].rec, c = C.calc(biga);
  check('Biga-Rezept: Teig gesamt 1220 g', near(c.D, 1220, 0.5), C.fmtG(c.D));
  check('Biga: 200 g Mehl / 100 g Wasser / 5 g Hefe', near(c.pfs[0].flour, 200, 0.1) && near(c.pfs[0].water, 100, 0.1) && near(c.pfs[0].yeast, 5, 0.01));
  check('Hauptteig: 500 g Mehl / 400 g Wasser / 15 g Salz', near(c.main.flours[0].g, 500, 0.1) && near(c.main.water, 400, 0.2) && near(c.main.salt, 15, 0.05));
  check('Trockenhefe bleibt Trockenhefe', biga.yeastType === 'dry');
  check('Ablauf vollständig (5 Schritte, 48 h Biga)', biga.steps.length === 5 && biga.steps[1].durationMin === 2880);
  check('Vorteig-Zuordnung der Schritte erhalten', biga.steps[0].stage === biga.preferments[0].id);
  const sd = recs[1].rec, c2 = C.calc(sd);
  check('Sauerteigbrot: 1 × 950 g', near(c2.D, 950, 0.5));
  check('Mehlmischung 85/15 erhalten', sd.flours.length === 2 && sd.flours[1].pct === 15);
  check('Anstellgut wird berechnet', c2.pfs[0].starter > 0);
  check('Dehnen & Falten (4× alle 30 min) erhalten', sd.steps[0].repeat?.count === 4 && sd.steps[0].repeat?.intervalMin === 30);
  check('Favorit erhalten', sd.favorite === true);
  check('Keine Rückfragen nötig', recs.every(({ rec }) => MG.openQuestions(rec).length === 0));
  const log = MG.importLog(f.logs[0]).rec;
  check('Tagebuch-Eintrag übernommen (v, Note, Teilnote, Temperaturen)', log.v === MG.SCHEMA && log.rating === 4 && log.sub.rim === 5 && log.fridgeTemp === '5' && near(log.params.hydration, 71.43, 0.001));
  // Erneuter Export + Import darf nichts verändern (idempotent)
  const again = MG.importRecipe(roundtrip(biga)).rec;
  check('Export → Import ändert nichts (Biga)', JSON.stringify(C.calc(again).totals) === JSON.stringify(c.totals) && again.steps.length === biga.steps.length);
}

// ---------- 2) Unvollständige Daten → App fragt nach, statt zu raten ----------
{
  group('Unvollständiges Rezept (incomplete-recipe.json)');
  const f = await load('incomplete-recipe.json');
  const { rec } = MG.importRecipe(f.recipes[0]);
  const ids = MG.openQuestions(rec).map((q) => q.id).sort();
  check('Fragt nach Kategorie, Hefe-Art und Teiglingsgewicht', JSON.stringify(ids) === JSON.stringify(['category', 'pieceWeight', 'yeastType']), ids.join(', '));
  check('Es wird nichts geraten (Hefe-Art leer)', rec.yeastType === '');
  const ans = { category: 'pizza', yeastType: 'fresh', pieceWeight: '280' };
  MG.openQuestions(rec).forEach((q) => q.apply(rec, ans[q.id]));
  check('Nach dem Nachtragen keine offenen Fragen', MG.openQuestions(rec).length === 0);
  check('Danach rechenbar: 4 × 280 g = 1120 g', near(C.calc(rec).D, 1120, 0.5));
}

// ---------- 3) Sicherung aus einer NEUEREN App-Version ----------
{
  group('Sicherung aus neuerer Version (future-schema99.json)');
  const f = await load('future-schema99.json');
  const m = MG.importRecipe(f.recipes[0]), r = m.rec;
  check('Als „neuere Version“ erkannt', m.newer === true);
  check('Unbekannte Felder bleiben erhalten (Rezept, Menge, Vorteig, Schritt)',
    r.futureRating?.crispness === 4 && r.yield.futureUnit === 'oz' && r.preferments[0].futurePfField === true && r.steps[0].futureStepField === 'Spirale');
  check('Versionskennung wird nicht herabgesetzt', r.v === 99);
  check('Bekannte Werte trotzdem nutzbar (4 × 250 g)', near(C.calc(r).D, 1000, 0.5));
  const l = MG.importLog(f.logs[0]);
  check('Tagebuch: unbekannte Felder erhalten', l.newer && l.rec.futureLogField === 'x' && l.rec.params.futureParam === 1);
}

// ---------- 3b) Sicherung aus App 1.6 (Format 2, Schema 2) → Schema 3 (Wassertemperatur & Eis) ----------
{
  group('Sicherung aus App 1.6 (backup-format2-app1.6.json)');
  const f = await load('backup-format2-app1.6.json');
  const { rec: r, newer } = MG.importRecipe(f.recipes[0]);
  check('Rezept auf aktuelles Format gebracht', r.v === MG.SCHEMA && !newer, `v=${r.v}`);
  check('Wasser-Angaben leer ergänzt (keine Annahme)', r.water.temp === '' && r.water.icePct === '' && r.water.pct === 71.43);
  check('Keine Rückfragen nötig', MG.openQuestions(r).length === 0);
  const c = C.calc(r);
  check('Mengen unverändert: 700 g Mehl, Biga 200/100/5 g', near(c.F, 700, 0.01) && near(c.pfs[0].flour, 200, 0.1) && near(c.pfs[0].water, 100, 0.1) && near(c.pfs[0].yeast, 5, 0.01));
  check('Ohne Angabe: kein Eis, keine Wassertemperatur', c.main.ice === 0 && c.main.waterTemp === '');
  check('Ablauf & Favorit erhalten', r.steps.length === 5 && r.steps[0].stage === r.preferments[0].id && r.favorite === true);
  const l = MG.importLog(f.logs[0]).rec;
  check('Tagebuch übernommen + neue Felder leer', l.v === MG.SCHEMA && l.rating === 5 && l.doughTemp === '24.5' && l.waterTemp === '' && l.iceG === '' && l.params.count === 4);
  // Neue Angaben setzen → Eis ersetzt Wasser, Hydration bleibt
  r.water.temp = 6; r.water.icePct = 25;
  const c2 = C.calc(r);
  check('25 % Eis = 100 g vom Hauptteig-Wasser', near(c2.main.ice, 100, 0.1) && near(c2.main.water, 400, 0.2), C.fmtG(c2.main.ice));
  check('Hydration und Teigmenge bleiben gleich', near(c2.totals.hydration, c.totals.hydration, 0.0001) && near(c2.D, c.D, 0.001));
  const back = MG.importRecipe(roundtrip(r)).rec;
  check('Export → Import erhält Wassertemperatur & Eis', back.water.temp === 6 && back.water.icePct === 25);
  const twice = MG.migrateRecipe(MG.migrateRecipe({ ...f.recipes[0] }).rec).rec;
  check('Migration ist idempotent', twice.water.temp === '' && twice.water.icePct === '' && twice.v === MG.SCHEMA);
  const unk = MG.importRecipe({ ...roundtrip(r), water: { pct: 70, temp: 5, icePct: 10, futureWaterField: 'x' } }).rec;
  check('Unbekannte Wasser-Felder bleiben erhalten', unk.water.futureWaterField === 'x');
  check('Ungültige Werte werden bereinigt', MG.importRecipe({ ...roundtrip(r), water: { pct: 70, temp: 'abc', icePct: 250 } }).rec.water.temp === ''
    && MG.importRecipe({ ...roundtrip(r), water: { pct: 70, icePct: 250 } }).rec.water.icePct === 100);
}

// ---------- 3c) Sicherung aus App 1.8 (Schema 3) → Schema 4 (Feingebäck & Kuchen) ----------
{
  group('Sicherung aus App 1.8 (backup-format2-app1.8.json)');
  const f = await load('backup-format2-app1.8.json');
  const { rec: r, newer } = MG.importRecipe(f.recipes[0]);
  check('Rezept auf aktuelles Format gebracht', r.v === MG.SCHEMA && !newer && MG.SCHEMA >= 4, `v=${r.v}`);
  check('Neue Felder leer ergänzt: kein Ziehfett, keine Form, keine Bestandteile', r.lamination.pct === 0 && r.pan.shape === '' && Array.isArray(r.parts) && r.parts.length === 0);
  check('Kategorie, Wassertemperatur und Vorteig unverändert', r.category === 'bread' && r.water.temp === 28 && r.preferments[0].starterPct === 100);
  check('Keine Rückfragen nötig', MG.openQuestions(r).length === 0);
  const c = C.calc(r);
  check('Mengen unverändert: 500 g Mehl, 885 g Teig', near(c.F, 500, 0.01) && near(c.D, 885, 0.5), C.fmtG(c.D));
  check('Sauerteig 70 g Anstellgut + 70 g Mehl + 70 g Wasser', near(c.pfs[0].starter, 70, 0.05) && near(c.pfs[0].freshFlour, 70, 0.05) && near(c.pfs[0].freshWater, 70, 0.05));
  check('Ohne Ziehfett: Teig ohne Butteranteil', c.lam.g === 0 && near(c.lam.base, c.D, 0.001));
  check('Ablauf erhalten (Zuordnung Vorteig/Hauptteig)', r.steps.length === 6 && r.steps[0].stage === r.preferments[0].id && r.steps[2].stage === 'main');
  const l = MG.importLog(f.logs[0]).rec;
  check('Tagebuch übernommen, Form leer ergänzt', l.v === MG.SCHEMA && l.rating === 4 && l.waterTemp === '28' && l.params.pan === '' && l.params.totalHours === 16);
  const twice = MG.migrateRecipe(MG.migrateRecipe({ ...f.recipes[0] }).rec).rec;
  check('Migration ist idempotent', twice.lamination.pct === 0 && twice.pan.shape === '' && twice.parts.length === 0 && twice.v === MG.SCHEMA);
  const back = MG.importRecipe(roundtrip(r)).rec;
  check('Export → Import ändert nichts', JSON.stringify(C.calc(back).totals) === JSON.stringify(c.totals) && back.steps.length === r.steps.length);
}

// ---------- 6) Feingebäck (Ziehfett) und Kuchen (Formen) ----------
{
  group('Feingebäck & Kuchen (Schema 4)');
  // a) Ziehfett gehört zum Teiggewicht
  const cr = C.TEMPLATES.find((t) => t.id === 'croissant').build();
  const c = C.calc(cr);
  check('Croissant: 12 × 85 g + 8 % Verschnitt = 1101,6 g Teig', near(c.D, 1101.6, 0.5), C.fmtG(c.D));
  check('Ziehfett = 50 % vom Mehl, Grundteig + Ziehfett = Teig', near(c.lam.g, c.F * 0.5, 0.01) && near(c.lam.base + c.lam.g, c.D, 0.001));
  check('Wirksame Flüssigkeit zählt Milch und Butter mit', c.totals.hydEff > c.totals.hydration + 20, `${C.fmtPct(c.totals.hydration)} → ${C.fmtPct(c.totals.hydEff)}`);
  const unk = MG.importRecipe({ ...roundtrip(cr), v: MG.SCHEMA, lamination: { pct: 55, name: 'Butter', futureLamField: 'x' } }).rec;
  check('Ziehfett: unbekannte Felder bleiben erhalten', unk.lamination.pct === 55 && unk.lamination.futureLamField === 'x');
  check('Ziehfett: ungültige Werte bereinigt', MG.importRecipe({ ...roundtrip(cr), lamination: { pct: -5, name: 7 } }).rec.lamination.pct === 0);
  check('Schritt-Art „Tourieren“ bleibt erhalten', MG.importRecipe(roundtrip(cr)).rec.steps.filter((s) => s.kind === 'laminate').length === 3);
  // b) Kuchen: Umrechnen nach Fläche, Stück, Faktor
  const mk = C.TEMPLATES.find((t) => t.id === 'biskuit').build();
  check('Ø 26 → Ø 20 cm: Faktor (20/26)² ≈ 0,59', near(C.calcCake(mk, { pan: { shape: 'round', d: 20 } }).factor, (20 / 26) ** 2, 0.0001));
  const k20 = C.calcCake(mk, { pan: { shape: 'round', d: 20 } });
  check('Zucker 120 g → 71 g', near(k20.parts[0].items.find((i) => i.name === 'Zucker').v, 120 * (20 / 26) ** 2, 0.01));
  check('Rund → eckig (30 × 20) nach Fläche', near(C.calcCake(mk, { pan: { shape: 'rect', l: 30, w: 20 } }).factor, 600 / (Math.PI * 169), 0.0001));
  check('Faktor direkt (1,5×)', C.calcCake(mk, { factor: 1.5 }).factor === 1.5);
  const muf = { ...mk, pan: { shape: 'count', n: 12 } };
  check('12 → 18 Muffins: Faktor 1,5', C.calcCake(muf, { pan: { shape: 'count', n: 18 } }).factor === 1.5);
  check('Stück ↔ Form nicht umrechenbar → Rezeptmenge + Hinweis', (() => { const x = C.calcCake(muf, { pan: { shape: 'round', d: 20 } }); return x.factor === 1 && x.warnings.length === 1; })());
  check('Eier: ungefähres Gewicht pro Stück', C.pieceGrams('Eier') === 52 && C.pieceGrams('Eigelb') === 18 && C.pieceGrams('Mehl') === 0);
  // c) Kuchen-Daten: Bereinigung & Erhalt
  const back = MG.importRecipe(roundtrip({ ...mk, v: MG.SCHEMA })).rec;
  check('Kuchen: Export → Import erhält Form, Bestandteile, Einheiten, Zuordnung', back.pan.shape === 'round' && back.pan.d === 26 && back.parts[0].items.length === 7
    && back.parts[0].items[0].unit === 'Stk' && back.steps[0].stage === back.parts[0].id);
  check('Kuchen: keine Rückfragen (kein Teiglingsgewicht nötig)', MG.openQuestions(back).length === 0);
  const evil = MG.importRecipe({ ...roundtrip(mk), pan: { shape: 'hexagon', d: -3 }, parts: [{ id: '<x>', name: '<b>', items: [{ name: 'A', amount: -2, unit: 'Eimer' }], futurePart: 1 }] }).rec;
  check('Kuchen: ungültige Werte bereinigt (Form, Menge, Einheit)', evil.pan.shape === '' && evil.pan.d === 0 && evil.parts[0].items[0].amount === 0 && evil.parts[0].items[0].unit === 'g' && evil.parts[0].id === 'x');
  check('Kuchen: unbekannte Felder bleiben erhalten', evil.parts[0].futurePart === 1);
  check('Kategorien Feingebäck & Kuchen werden akzeptiert', MG.importRecipe({ ...roundtrip(cr) }).rec.category === 'fine' && back.category === 'cake');
  // d) KI-Brücke: Kuchen (Format B) und Croissant mit Ziehfett
  const KI = await import('../ki-import.js');
  const kc = MG.importRecipe(KI.kiToRecipe({ name: 'Rührkuchen', category: 'cake', pan: { shape: 'rect', length_cm: 30, width_cm: 11 },
    parts: [{ name: 'Teig', items: [{ name: 'Mehl', amount: 0.3, unit: 'kg' }, { name: 'Eier', amount: 4, unit: 'Stück' }, { name: 'Milch', amount: 125, unit: 'ml' }, { name: 'Backpulver', amount: 1, unit: 'Päckchen' }] }],
    steps: [{ kind: 'mix', name: 'Rühren', minutes: 10, stage: 'part1' }, { kind: 'bake', name: 'Backen', minutes: 50, location: 'oven' }] }, { schema: MG.SCHEMA }).recipe).rec;
  check('KI: Kuchen mit Form, Einheiten (kg → g, Stück → Stk) und Zuordnung', kc.category === 'cake' && kc.pan.l === 30 && kc.parts[0].items[0].amount === 300 && kc.parts[0].items[0].unit === 'g'
    && kc.parts[0].items[1].unit === 'Stk' && kc.parts[0].items[3].unit === 'Pck' && kc.steps[0].stage === kc.parts[0].id);
  const kr = MG.importRecipe(KI.kiToRecipe({ name: 'Croissant', category: 'fine', yeastType: 'fresh', main: { flours: [{ name: 'Weizenmehl 550', g: 500 }], water_g: 140, salt_g: 10, yeast_g: 20,
    extras: [{ name: 'Milch', g: 140 }, { name: 'Zucker', g: 60 }] }, lamination: { name: 'Butter', g: 250 } }, { schema: MG.SCHEMA }).recipe).rec;
  check('KI: Croissant – Ziehfett 250 g = 50 %, Kategorie Feingebäck', kr.category === 'fine' && near(kr.lamination.pct, 50, 0.001) && near(C.calc(kr).lam.g, 250, 0.05));
}

// ---------- 3d) Sicherung aus App 1.9 (Schema 4) → Schema 5 (Nebenher-Schritte, Backprotokoll) ----------
{
  group('Sicherung aus App 1.9 (backup-format2-app1.9.json)');
  const f = await load('backup-format2-app1.9.json');
  const { rec: r, newer } = MG.importRecipe(f.recipes[0]);
  check('Rezept auf aktuelles Format gebracht', r.v === MG.SCHEMA && !newer && MG.SCHEMA >= 5, `v=${r.v}`);
  check('Paralleler Schritt bleibt „zusammen starten“ (wie bisher)', r.steps[3].parallel === true && r.steps[3].align === '');
  const tl = C.timeline(r.steps, 0);
  check('Zeitplan unverändert: Vorheizen startet mit der Stückgare', tl[3].start === tl[2].start && tl[4].start === tl[2].end, `${tl[3].start / 60000} min`);
  check('Keine Rückfragen nötig', MG.openQuestions(r).length === 0);
  const l = MG.importLog(f.logs[0]).rec;
  check('Tagebuch: ohne Backprotokoll (nichts erfunden), Rest unverändert', l.v === MG.SCHEMA && l.protocol === null && l.rating === 4 && l.nextTime === 'mehr Wasser');
  const twice = MG.migrateRecipe(MG.migrateRecipe({ ...f.recipes[0] }).rec).rec;
  check('Migration ist idempotent', twice.steps[3].align === '' && twice.v === MG.SCHEMA);
  // „Zusammen fertig“: Vorheizen endet genau mit der Stückgare
  const r2 = MG.importRecipe({ ...roundtrip(r), steps: r.steps.map((s, i) => (i === 3 ? { ...s, align: 'end' } : s)) }).rec;
  const t2 = C.timeline(r2.steps, 0);
  check('„Zusammen fertig“: Vorheizen startet 15 min nach Beginn der Stückgare, endet gleichzeitig', r2.steps[3].align === 'end' && t2[3].start === t2[2].start + 15 * 60000 && t2[3].end === t2[2].end);
  check('„Zusammen fertig“: Backen beginnt direkt nach der Stückgare', t2[4].start === t2[2].end && C.planInfo(r2.steps, 0).total === C.planInfo(r.steps, 0).total);
  const longer = C.timeline(r2.steps.map((s, i) => (i === 3 ? { ...s, durationMin: 90 } : s)), 0);
  check('Vorheizen länger als die Gare: startet schon vorher, Backen pünktlich', longer[3].end === longer[2].end && longer[3].start < longer[2].start && longer[4].start === longer[2].end);
  check('align ohne parallel wird ignoriert', MG.importRecipe({ ...roundtrip(r), steps: [{ ...r.steps[0], align: 'end' }] }).rec.steps[0].align === '');
  // Backprotokoll: Bereinigung und Erhalt
  const proto = { startAt: 1, endAt: 2, hydration: 74, baseHydration: 72, dough: 912,
    steps: [{ name: 'Stockgare', kind: 'bulk', loc: 'rt', plan: 120, act: 150, start: 1, note: 'sehr klebrig', feel: 'sticky', photos: ['abc', '<x>'], meas: { dough: 25.5, bad: 3 }, futureStep: 1 },
      { name: '<img onerror=x>', kind: 'hack', loc: 'mars', plan: 'x', act: null, feel: 'nass' }],
    blocks: [{ title: 'Hauptteig', rows: [{ name: 'Wasser', txt: '370 g', was: '360 g' }] }],
    changes: [{ stage: 'Hauptteig', name: 'Wasser', from: '360 g', to: '370 g' }],
    pct: { water: 74, salt: 2, yeast: 0.5, oil: 0, lam: 0, flours: [{ name: 'Weizenmehl 550', pct: 100 }], extras: [], pfs: [], cake: [] }, futureProto: 'x' };
  const lp = MG.importLog({ ...roundtrip(f.logs[0]), v: MG.SCHEMA, protocol: proto }).rec;
  const p0 = lp.protocol.steps[0], p1 = lp.protocol.steps[1];
  check('Protokoll: Schritt mit geplant/tatsächlich, Notiz, Teiggefühl, Foto, Messwert', p0.plan === 120 && p0.act === 150 && p0.note === 'sehr klebrig' && p0.feel === 'sticky' && p0.photos.join() === 'abc,x' && p0.meas.dough === 25.5 && p0.meas.bad === undefined);
  check('Protokoll: ungültige Werte bereinigt', p1.kind === 'other' && p1.loc === 'rt' && p1.plan === null && p1.act === null && p1.feel === '');
  check('Protokoll: unbekannte Felder bleiben erhalten', lp.protocol.futureProto === 'x' && p0.futureStep === 1);
  check('Protokoll: Export → Import ändert nichts', JSON.stringify(MG.importLog(roundtrip(lp)).rec.protocol) === JSON.stringify(lp.protocol));
  // Übernahme ins Rezept (applyPct): Anteile vom Backtag, Menge bleibt
  const ap = C.applyPct(structuredClone(r), lp.protocol.pct);
  check('„Ins Rezept übernehmen“: Hydration 74 %, Menge 1 × 900 g bleibt', ap.water.pct === 74 && ap.yield.pieceWeight === 900 && near(C.calc(ap).D, 900, 0.5));
  const cake = C.TEMPLATES.find((t) => t.id === 'biskuit').build();
  const cp = C.applyPct(structuredClone(cake), { cake: [{ id: cake.parts[0].id, items: [{ name: 'Eier', amount: 5, unit: 'Stk' }] }] });
  check('„Ins Rezept übernehmen“ (Kuchen): Zutatenliste des Backtags', cp.parts[0].items.length === 1 && cp.parts[0].items[0].amount === 5);
}

// ---------- 3e) Sicherung aus App 2.0 (Schema 5) → Schema 6 (neue Vorteige) ----------
{
  group('Sicherung aus App 2.0 (backup-format2-app2.0.json) + neue Vorteige');
  const f = await load('backup-format2-app2.0.json');
  const { rec: r, newer } = MG.importRecipe(f.recipes[0]);

  check('Und zurück auf Hefe: Sauerteig wird Biga/Poolish mit Hefe, Hauptteig-Hefe gesetzt', ['biga', 'poolish'].includes(back.recipe.preferments[0].type) && C.calc(back.recipe).totals.yeast > 0 && C.calc(back.recipe).warnings.length === 0);
  const KI = await import('../ki-import.js');
  const kb = MG.importRecipe(KI.kiToRecipe({ name: 'Bierbrot', category: 'bread', preferments: [{ type: 'levain', flours: [{ name: 'Roggenmehl 1150', g: 80 }, { name: 'Weizenmehl 550', g: 20 }], water_g: 0, milk_g: 100, liquid_name: 'Bier', starter_g: 20 }],
    main: { flours: [{ name: 'Weizenmehl 550', g: 400 }], water_g: 300, salt_g: 10, extras: [] } }, { schema: MG.SCHEMA }).recipe).rec;
  const ckb = C.calc(kb);
  check('KI: Mehlmischung und Bier im Sauerteig erkannt', kb.preferments[0].flours.length === 2 && kb.preferments[0].liquidName === 'Bier' && near(ckb.pfs[0].milkG, 100, 0.5) && near(ckb.main.extras.find((e) => e.name === 'Bier').total, 100, 0.5) && ckb.warnings.length === 0);
}

// ---------- 3i) Sicherung aus App 2.5 (Schema 8) → Schema 9: Meine Mehle ----------
{
  group('Sicherung aus App 2.5 (backup-format2-app2.5.json) + Meine Mehle 2.6');
  const f = await load('backup-format2-app2.5.json');
  const { rec: r, newer } = MG.importRecipe(f.recipes[0]);
  check('Rezept auf aktuelles Format gebracht, Inhalt unverändert', r.v === MG.SCHEMA && !newer && MG.SCHEMA >= 9 && r.preferments[0].flours.length === 2 && r.preferments[0].liquidName === 'Bier', `v=${r.v}`);
  check('Sicherung ohne „flours“ → keine Mehle, kein Fehler', !('flours' in f) || Array.isArray(f.flours));
  const c = C.calc(r);
  check('Rechnung unverändert: Biga 200 g Nuvola + 200 g Manitoba, Hauptteig 600 g Nuvola', near(c.pfs[0].flourParts[0].g, 200, 0.01) && near(c.pfs[0].flourParts[1].g, 200, 0.01) && near(c.main.flours[0].g, 600, 0.01) && near(c.main.flours[1].g, 0, 0.01));
  // Datenart „Meine Mehle“: alles freiwillig, Unsinn wird bereinigt, unbekannte Felder bleiben
  const fl = MG.importFlour({ id: 'nuv', name: 'Caputo Nuvola', w: '310', protein: 13, absorption: '', falling: -5, color: 'lila', zukunft: 42 }).rec;
  check('Mehl: Werte bereinigt (W 310, leer bleibt leer, negative Fallzahl → 0, unbekannte Farbe → gold), unbekanntes Feld bleibt', fl.v === MG.SCHEMA && fl.w === 310 && fl.protein === 13 && fl.absorption === '' && fl.falling === 0 && fl.color === 'gold' && fl.zukunft === 42);
  const X = await import('../extras.js');
  X.setMyFlours([fl, MG.importFlour({ id: 'x2', name: 'Hausmehl', protein: 12 }).rec, MG.importFlour({ id: 'x3', name: 'Enzymmehl', w: 260, falling: 170 }).rec]);
  const p1 = X.flourProps('Caputo Nuvola'), p2 = X.flourProps('hausmehl');
  check('Eigenes Mehl: W von der Packung hat Vorrang', p1.mine && p1.w === 310 && p1.wSrc === 'Packung');
  check('Ohne W: aus Eiweiß geschätzt (12 % → W 270, verträgt ca. 72,6 % Wasser)', p2.mine && p2.w === 270 && /geschätzt/.test(p2.wSrc) && near(p2.cap, 72.6, 0.01));
  const ampR = { ...roundtrip(r), flours: [{ name: 'Enzymmehl', pct: 100 }], preferments: [], water: { pct: 65 }, steps: [{ id: 'a', kind: 'mix', stage: 'main', durationMin: 15, location: 'rt' }, { id: 'b', kind: 'proof', durationMin: 2880, location: 'fridge' }] };
  const amp = X.flourCheck(ampR);
  check('Niedrige Fallzahl (170 s) + 24 h Gare → Ampel warnt (Enzyme)', amp.level !== 'green' && amp.items.some((x) => /Fallzahl/.test(x.text)), amp.level);
  check('Mehlbedarf und Kosten je eigenem Mehl', (() => { X.setMyFlours([{ ...fl, price: 2.5 }]); const n = X.flourNeeds(C.calc({ ...roundtrip(r), preferments: [] })); return n.length === 1 && near(n[0].g, 800, 0.01) && near(X.flourCost(n), 2, 0.001); })());
  X.setMyFlours([]);
}

// ---------- 3j) Sicherung aus App 2.6 (Schema 9) → Schema 10: Getreide + Art bei „Meine Mehle“ ----------
{
  group('Sicherung aus App 2.6 (backup-format2-app2.6.json) + Mehl-Katalog 2.7');
  const f = await load('backup-format2-app2.6.json');
  const fl = f.flours.map((x) => MG.importFlour(x).rec), by = (id) => fl.find((x) => x.id === id);
  check('Alle Mehle auf Schema 10, Werte unverändert, alte „Sorte“ bleibt', fl.every((x) => x.v === MG.SCHEMA) && MG.SCHEMA >= 10 && by('fl00').w === 260 && by('fl00').kind === 'tipo00' && by('flrog').falling === 180 && by('flw').stock === 3000);
  check('Eindeutige Sorten übernommen: Tipo 00 → Weizen/Tipo 00, Roggen → Getreide Roggen (Art leer)', by('fl00').grain === 'weizen' && by('fl00').type === 'it-00' && by('flrog').grain === 'roggen' && by('flrog').type === '');
  check('Nicht eindeutig → nichts geraten: Vollkorn/ohne Sorte bleiben leer, „Weizenmehl (405–1050)“ nur Getreide', by('flvk').grain === '' && by('flvk').type === '' && by('flx').grain === '' && by('flw').grain === 'weizen' && by('flw').type === '');
  check('Unbekanntes Feld bleibt erhalten', by('flvk').zukunft === 'bleibt');
  check('Migration mehrfach ausführbar (idempotent)', JSON.stringify(MG.importFlour(by('fl00')).rec) === JSON.stringify(by('fl00')));
  check('Getreide/Art bereinigt: Unsinn → leer, unbekannte gültige Art (neuere App) bleibt', (() => { const a = MG.importFlour({ id: 'q', name: 'x', grain: '<b>', type: 'zz-neu' }).rec; return a.grain === '' && a.type === 'zz-neu'; })());
  const r = MG.importRecipe(f.recipes[0]).rec;
  check('Rezept unverändert (Schema 10)', r.v === MG.SCHEMA && r.flours.length === 2 && r.flours[0].name === 'Weizenmehl 700 Fuchsenmühle');
  const X = await import('../extras.js');
  // Namen erkennen (AT/DE/IT)
  const tn = (n) => X.typeFromName(n)?.id || '';
  check('Art aus dem Namen: W700, R960, 1050, Tipo 00, Tipo 00 W 330, Dinkel 630, Semola, Vollkorn', tn('Weizenmehl 700 Fuchsenmühle') === 'at-w700' && tn('Roggenmehl R960') === 'at-r960' && tn('Weizenmehl Type 1050') === 'de-1050'
    && tn('Tipo 00') === 'it-00' && tn('Caputo Tipo 00 W 330') === 'it-00s' && tn('Dinkelmehl 630') === 'de-d630' && tn('Semola rimacinata') === 'it-semrim' && tn('Weizenvollkornmehl') === 'w-voll' && tn('Buchweizenmehl') === 'o-buchw' && tn('Caputo Nuvola') === '');
  check('Österreichische Typen sind kein W-Wert (W1600 ≠ W 160, W700 ≠ W 700)', X.wInName('Weizenmehl W1600') === 0 && X.wInName('Weizenmehl W700') === 0 && X.wInName('Tipo 00 W 300') === 300);
  X.setMyFlours(fl);
  const pw = X.flourProps('Weizenmehl 700 Fuchsenmühle'), pr = X.flourProps('Roggenmehl 960'), p0 = X.flourProps('Caputo Pizzeria');
  check('Richtwerte über Getreide + Name: W700 → W ≈ 230, Roggen ohne W', pw.mine && pw.w === 230 && /W700/.test(pw.wSrc) && pr.rye && pr.w === null && p0.w === 260 && p0.wSrc === 'Packung');
  check('Ohne Getreide weiter wie bisher (Weizen-Formel)', (() => { const h = MG.importFlour({ id: 'h', name: 'Hausmehl', protein: 12 }).rec; X.setMyFlours([h]); const p = X.flourProps('Hausmehl'); return p.w === 270 && Math.abs(p.cap - 72.6) < 0.01; })());
  check('Dinkel: viel Eiweiß ≠ viel Kraft (13 % → W ≈ 186 statt 310)', (() => { X.setMyFlours([MG.importFlour({ id: 'd', name: 'Mein Dinkel', grain: 'dinkel', type: 'de-d630', protein: 13 }).rec]); return X.flourProps('Mein Dinkel').w === 186; })());
  X.setMyFlours([]);
  // Mischung und Mehltausch
  const ana = X.blendInsights([{ name: 'Weizenmehl 550', pct: 70 }, { name: 'Roggenmehl 1150', pct: 30 }]);
  check('Mischungs-Analyse: Zusammensetzung, Roggen-Säuerung', ana.blend.rye === 30 && ana.items.some((x) => /70 % Weizen · 30 % Roggen/.test(x.t)) && ana.items.some((x) => /Sauerteig/.test(x.t)));
  const sw = X.waterShift([{ name: 'Weizenmehl 1050', pct: 100 }], [{ name: 'Weizenmehl W700', pct: 100 }]);
  check('Tausch 1050 → W700: nimmt ca. 2 %-Punkte weniger Wasser auf', sw && sw.d < -1 && sw.d > -4, sw && sw.d);
  const man = X.blendInsights([{ name: 'Weizenmehl 550', pct: 100 }], { hours: 40 });
  check('Lange Gare mit schwachem Mehl → Manitoba-Anteil wird vorgeschlagen', man.items.some((x) => /Manitoba/.test(x.t) && x.lvl === 'warn'));
}

// ---------- 5) Rezept aus KI-Antwort (KI-Brücke) ----------
{
  group('Rezept aus KI-Antwort (ki-import.js)');
  const KI = await import('../ki-import.js');
  const imp = (d) => MG.importRecipe(KI.kiToRecipe(d, { schema: MG.SCHEMA }).recipe).rec;
  // a) Biga – Antwort mit Begleittext, Codeblock, „schlauen“ Anführungszeichen und überzähligem Komma
  const answer = `Klar! Hier ist das Rezept:\n\`\`\`json\n{ "teigbuch": "ki-1", "name": „Pizza mit Biga“, "category": "pizza", "yeastType": "dry",
    "pieces": {"count": 5, "weight_g": 244},
    "preferments": [{"type": "biga", "name": "Biga", "flour_name": "Tipo 00", "flour_g": 200, "water_g": 100, "yeast_g": 5}],
    "main": {"flours": [{"name": "Tipo 00", "g": 500}], "water_g": 400, "salt_g": 15, "yeast_g": 0, "oil_g": 0, "extras": []},
    "steps": [{"kind": "prep", "name": "Biga ansetzen", "minutes": 10, "location": "rt", "stage": "pf1"},
              {"kind": "rest", "name": "Biga reifen", "minutes": 2880, "location": "fridge", "stage": "pf1"},
              {"kind": "mix", "name": "Hauptteig kneten", "minutes": 15, "location": "rt", "stage": "main"},
              {"kind": "fold", "name": "Dehnen & Falten", "minutes": 120, "location": "rt", "repeat": {"count": 4, "interval_min": 30}},],
    "notes": "" }\n\`\`\`\nGuten Appetit!`;
  const biga = imp(KI.extractJSON(answer)), cb = C.calc(biga);
  check('Antwort mit Begleittext wird gelesen', biga.name === 'Pizza mit Biga');
  check('Biga: 700 g Mehl, Teig 1220 g (wie Original)', near(cb.F, 700, 0.01) && near(cb.D, 1220, 0.5), C.fmtG(cb.D));
  check('Biga 200/100/5 g, Hauptteig 500 g Mehl / 400 g Wasser / 15 g Salz', near(cb.pfs[0].flour, 200, 0.1) && near(cb.pfs[0].water, 100, 0.1) && near(cb.pfs[0].yeast, 5, 0.01)
    && near(cb.main.flours[0].g, 500, 0.1) && near(cb.main.water, 400, 0.2) && near(cb.main.salt, 15, 0.05));
  check('Hydration 71,4 %, Trockenhefe, 5 × 244 g', near(biga.water.pct, 71.43, 0.01) && biga.yeastType === 'dry' && biga.yield.count === 5 && biga.yield.pieceWeight === 244);
  check('Schritte inkl. Vorteig-Zuordnung und Wiederholung', biga.steps.length === 4 && biga.steps[0].stage === biga.preferments[0].id && biga.steps[2].stage === 'main'
    && biga.steps[1].location === 'fridge' && biga.steps[3].repeat?.count === 4);
  check('Keine Rückfragen nötig', MG.openQuestions(biga).length === 0);
  // b) Sauerteig: Levain mit Anstellgut + Mehlmischung
  const sd = imp({ name: 'Landbrot', category: 'bread', yeastType: '',
    preferments: [{ type: 'levain', name: 'Levain', flour_name: 'Weizenmehl 550', flour_g: 50, water_g: 50, starter_g: 20, starter_hydration: 100 }],
    main: { flours: [{ name: 'Weizenmehl 550', g: 350 }, { name: 'Roggenmehl 1150', g: 50 }], water_g: 280, salt_g: 9 }, steps: [] });
  const cs = C.calc(sd);
  check('Levain: 20 g Anstellgut + 50 g Mehl + 50 g Wasser', near(cs.pfs[0].starter, 20, 0.05) && near(cs.pfs[0].freshFlour, 50, 0.05) && near(cs.pfs[0].freshWater, 50, 0.05));
  // Gesamtmehl = 350 + 50 (Hauptteig) + 50 (Levain) + 10 (Mehl im Anstellgut) = 460 g
  check('Mehlmischung inkl. Mehl im Anstellgut (460 g, Roggen 10,9 %), Hauptteig 280 g Wasser', near(cs.F, 460, 0.01) && sd.flours.length === 2 && near(sd.flours[1].pct, 10.87, 0.01) && near(cs.main.water, 280, 0.2) && near(cs.main.flours[0].g, 350, 0.1));
  check('Ohne Hefe: keine Rückfrage zur Hefe-Art', MG.openQuestions(sd).length === 0);
  // c) Anstellgut direkt im Hauptteig + Eis + Wassertemperatur
  const di = imp({ name: 'Schnelles Sauerteigbrot', category: 'bread',
    preferments: [{ type: 'levain', name: 'Anstellgut', flour_g: 0, water_g: 0, starter_g: 100, starter_hydration: 100 }],
    main: { flours: [{ name: 'Weizenmehl 550', g: 450 }], water_g: 280, ice_g: 50, water_temp_c: 8, salt_g: 10 } });
  const cd = C.calc(di);
  check('Anstellgut direkt: 500 g Mehl, 76 % Hydration, 890 g Teig', near(cd.F, 500, 0.01) && near(di.water.pct, 76, 0.01) && near(cd.D, 890, 0.5));
  check('Eis 50 g + Wasser 8 °C werden übernommen', near(cd.main.ice, 50, 0.1) && di.water.temp === 8 && near(cd.main.water - cd.main.ice, 280, 0.2));
  // d) Fehlerfälle
  const err = (fn) => { try { fn(); return ''; } catch (e) { return e.message; } };
  check('Antwort ohne Rezept-Code → verständlicher Fehler', /kein Rezept-Code/.test(err(() => KI.extractJSON('Ich kann das Bild leider nicht lesen.'))));
  check('Abgeschnittene Antwort → verständlicher Fehler', /unvollständig/.test(err(() => KI.extractJSON('{"name": "x", "main": {"flours": [ {"name"'))));
  check('Ohne Mehl → verständlicher Fehler', /keine Mehlmenge/.test(err(() => KI.kiToRecipe({ main: { water_g: 300 } }))));
  const evil = imp({ name: '<img src=x onerror=alert(1)>', category: 'evil', main: { flours: [{ name: 'Mehl', g: 100 }], water_g: 60 }, steps: [{ kind: 'hack', location: 'mars', minutes: -5 }] });
  check('Unbekannte Werte werden bereinigt (Kategorie, Schritt-Art, Ort, Dauer)', evil.category === '' && evil.steps[0].kind === 'other' && evil.steps[0].location === 'rt' && evil.steps[0].durationMin === 0);
  check('Auftragstext enthält Link bzw. Text', KI.buildPrompt('https://example.com/rezept').includes('https://example.com/rezept') && KI.buildPrompt('500 g Mehl').includes('500 g Mehl'));
  // e) Echte Antwort (Milchbrot): deutsche Anführungszeichen „…“ im Notiz-Text dürfen nicht stören
  const milch = await (await fetch(`./fixtures/ki-antwort-milchbrot.txt?t=${Date.now()}`)).text();
  const mb = err(() => KI.extractJSON(milch)) || imp(KI.extractJSON(milch));
  check('Milchbrot mit „Anführungszeichen“ im Text wird gelesen', typeof mb === 'object' && mb.name === 'Brioche' && mb.notes.includes('„Mehl (Tangzhong)“') && mb.category === 'fine', typeof mb === 'string' ? mb : '');
  check('Milchbrot: 840 g Mehl, Milch als wirksame Flüssigkeit', typeof mb === 'object' && near(C.calc(mb).F, 840, 0.01) && C.calc(mb).totals.hydEff > 50);
  const al = imp({ name: 'x', main: { flours: [{ name: 'Mehl', g: 500 }], water_g: 350 }, steps: [{ kind: 'proof', minutes: 60 }, { kind: 'preheat', minutes: 45, parallel: true, align: 'end' }] });
  check('KI: „Zusammen fertig“ (align end) wird übernommen', al.steps[1].parallel && al.steps[1].align === 'end');
}

// ---------- 4) Alle Vorlagen überstehen Export → Import ----------
{
  group('Vorlagen: Export → Import (aktuelles Format)');
  for (const t of C.TEMPLATES) {
    const r = t.build(); r.v = MG.SCHEMA;
    const back = MG.importRecipe(roundtrip(r)).rec;
    const calcAny = (x) => (C.isCake(x) ? C.calcCake(x).total : C.calc(x).totals);
    const same = JSON.stringify(calcAny(back)) === JSON.stringify(calcAny(r)) && back.steps.length === r.steps.length
      && back.steps.every((s, i) => s.durationMin === r.steps[i].durationMin && s.location === r.steps[i].location && s.stage === r.steps[i].stage);
    check(`„${r.name}“ unverändert`, same && MG.openQuestions(back).length === 0);
  }
}

const sum = document.getElementById('sum');
sum.textContent = fail ? `✘ ${fail} von ${pass + fail} Prüfungen fehlgeschlagen` : `✔ Alle ${pass} Prüfungen bestanden`;
sum.className = `sum ${fail ? 'bad' : 'ok'}`;
document.title = (fail ? '✘ ' : '✔ ') + document.title;
window.__compat = { pass, fail };
</script>
</body>
</html>
